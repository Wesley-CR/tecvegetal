# Al publicar un Release en GitHub: corre los tests, compila para Chrome y
# Firefox y le adjunta los zips. También se puede correr a mano (Actions →
# Release → Run workflow) para verificar que compila, sin publicar nada.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - run: npm run zip

      - name: Adjuntar zips al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .output/*-chrome.zip .output/*-firefox.zip .output/*-sources.zip --clobber

      - name: Guardar zips como artefacto
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tecvegetal-zips
          path: .output/*.zip
